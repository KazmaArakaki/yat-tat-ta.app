services:
  app:
    image: localhost/yat-tat-ta-app
    build:
      context: ..
      dockerfile: ./.devcontainer/Dockerfile
    container_name: yat-tat-ta-app
    command: sleep infinity
    shm_size: "1gb"
    volumes:
      - ~/.claude:/home/vscode/.claude
      - ~/.claude.json:/home/vscode/.claude.json
      - ..:/workspace
    networks:
      app-network:

  reverse-proxy:
    image: nginx:1.29.3-trixie
    container_name: yat-tat-ta-reverse-proxy
    volumes:
      - ./reverse-proxy/etc/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../docs:/etc/nginx/html
      # Firebase Hosting で出す公開ページ（プライバシーポリシーとサポート）
      - ../firebase/public:/etc/nginx/site
    environment:
      VIRTUAL_HOST: "*.yat-tat-ta.localhost"
    networks:
      app-network:
      localhost-proxy-network:

networks:
  app-network:
  localhost-proxy-network:
    external: true
  localhost-postgresql-network:
    external: true
