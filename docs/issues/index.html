<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課題一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        paper: '#FBF6EE', ink: '#1C1916', mute: '#6E655C', rule: '#E7DDCC',
        dopa: { DEFAULT: '#E5337A', soft: '#FFE6F0', pale: '#FFF3E4', body: '#FF97BF' },
        signal: '#2F79F7', gold: '#E9A800', violet: '#7B4FD6'
      },
      fontFamily: {
        sans: ['"Noto Sans JP"', 'sans-serif'],
        display: ['"Dela Gothic One"', '"Noto Sans JP"', 'sans-serif'],
        mono: ['"JetBrains Mono"', 'monospace']
      },
      keyframes: { rise: { '0%': { opacity: '0', transform: 'translateY(8px)' }, '100%': { opacity: '1', transform: 'none' } } },
      animation: { rise: 'rise .5s ease-out both' }
    }
  }
}
</script>
</head>
<body class="min-h-screen bg-paper font-sans text-ink antialiased">
<main class="px-4 py-12 sm:px-10 lg:py-16">
  <div class="mx-auto max-w-3xl">
    <p class="font-mono text-xs uppercase tracking-[0.2em] text-mute">issues</p>
    <h1 class="mt-2 font-display text-4xl">課題一覧</h1>
    <p class="mt-4 text-sm text-ink/80">セッションの中で片付かず、先に送った作業。</p>

    <section id="dev-environment" class="mt-10">
      <h2 class="font-display text-xl">開発環境</h2>
      <ul class="mt-3 border-t-2 border-ink">
        <li class="border-b border-rule">
          <a href="ios-app-baseline/index.html" class="group block py-5">
            <div class="flex flex-wrap items-center gap-3">
              <h3 class="font-display text-lg group-hover:text-dopa">iOS アプリの土台を決める</h3>
              <span class="rounded-full bg-dopa px-2.5 py-0.5 font-mono text-[11px] font-bold text-white">優先度：高</span>
              <span class="rounded-full border border-mute bg-white px-2.5 py-0.5 font-mono text-[11px] font-bold text-ink">未着手</span>
            </div>
            <p class="mt-2 text-sm leading-relaxed text-ink/80">最小対応 iOS、置き場所、Bundle Identifier、iPhone 専用化。本番プロジェクトを作る前に決める。</p>
          </a>
        </li>
        <li class="border-b border-rule opacity-60">
          <a href="ios-dev-environment-setup/index.html" class="group block py-5">
            <div class="flex flex-wrap items-center gap-3">
              <h3 class="font-display text-lg line-through decoration-2 group-hover:text-dopa">iOS 開発環境の準備</h3>
              <span class="rounded-full bg-ink px-2.5 py-0.5 font-mono text-[11px] font-bold text-white">完了 2026-10-06</span>
            </div>
            <p class="mt-2 text-sm leading-relaxed text-ink/80">Apple ID と Xcode を整え、空のアプリを iPhone 15 Pro で起動した。</p>
          </a>
        </li>
      </ul>
    </section>
  </div>
</main>
<script src="../sidebar.js" defer></script>
</body>
</html>
