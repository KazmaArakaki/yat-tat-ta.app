name: YatTatTa
options:
  deploymentTarget:
    iOS: "26.0"
  # 開発言語。文言は String Catalog（Localizable.xcstrings）に集める
  developmentLanguage: ja
packages:
  # 記録は Firestore、ログインは Firebase Authentication（docs/devops/firebase）
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.19.0"
targets:
  YatTatTa:
    type: application
    platform: iOS
    sources: [YatTatTa]
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAppCheck
      # 共有のリンクカードを作る関数を呼ぶ（docs/features/share-card）
      - package: Firebase
        product: FirebaseFunctions
    # Sign in with Apple と、App Check の App Attest（Release で使う）
    entitlements:
      path: YatTatTa/YatTatTa.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.devicecheck.appattest-environment: production
    # Debug は開発用、Release は本番用の Firebase に書く（docs/devops/firebase#environments）
    # 設定ファイルは Firebase/Dev と Firebase/Prod に置き、ビルドの最後にアプリへ写す
    postBuildScripts:
      - name: Firebase の設定ファイルを写す
        script: |
          if [ ! -f "${SCRIPT_INPUT_FILE_0}" ]; then
            echo "error: ${SCRIPT_INPUT_FILE_0} がありません。docs/devops/firebase の手順で置いてください"
            exit 1
          fi
          cp "${SCRIPT_INPUT_FILE_0}" "${SCRIPT_OUTPUT_FILE_0}"
        inputFiles:
          - $(SRCROOT)/Firebase/$(FIREBASE_ENV)/GoogleService-Info.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
    scheme:
      testTargets: [YatTatTaTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yat-tat-ta
        DEVELOPMENT_TEAM: K334V22YZ3
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        # INFOPLIST_KEY_ で書けないキーだけを置く。生成分とマージされる
        INFOPLIST_FILE: YatTatTa/Info.plist
        # App Store Connect のバージョンとそろえる。TestFlight に上げるたびに CURRENT_PROJECT_VERSION を1つ上げる
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        # 端末の言語が日本語でも英語でもないときに使う言語（Info.plist の CFBundleDevelopmentRegion）。
        # 文言を書く言語（String Catalog の元の言語）は、プロジェクトの developmentLanguage の日本語のまま
        DEVELOPMENT_LANGUAGE: en
        # ホーム画面のアプリ名。全言語で同じ表記
        INFOPLIST_KEY_CFBundleDisplayName: "Yat Tat Ta"
        # iPhone のみ
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        # Info.plist（Xcode 27 の新規 App と同じ値）
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # 縦だけ。連打中に横へ倒れると、ボタンの位置が動いて指が外れる
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        # Swift（Xcode 27 の新規 App と同じ値）
        SWIFT_VERSION: "5.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        # 文言を String Catalog（Localizable.xcstrings）へ書き出す
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # アイコンは Icon Composer の YatTatTa/AppIcon.icon。層の SVG は Design/app_icon.py で書き出す
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          FIREBASE_ENV: Dev
        Release:
          FIREBASE_ENV: Prod
  YatTatTaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [YatTatTaTests]
    dependencies:
      - target: YatTatTa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yat-tat-ta.tests
        DEVELOPMENT_TEAM: K334V22YZ3
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
